    <style>
        /* Estilos híbridos */
        :root {
            --purple: #6027a9;
            --green: #ccffd2;
            --pink: #ff69b4;
            font-family: 'Inconsolata', monospace;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--purple);
            color: var(--green);
            text-align: center;
            min-height: 85dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo Matrix */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .container {
            max-width: 300px;
            width: 80%;
            margin: 0 auto;
            border: 6px solid var(--purple);
            padding: 20px;
            background-color: var(--green);
            box-shadow: 12px 12px 0 #ccffd280;
            position: relative;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 3px solid var(--green);
            z-index: -1;
        }

/* Efecto glitch más suave para el título */
.glitch {
    position: relative;
    display: inline-block;
}

.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.8;
}

.glitch::before {
    left: 1px;
    text-shadow: -1px 0 var(--pink);
    animation: glitch-anim 2s infinite linear alternate-reverse;
    clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
}

.glitch::after {
    left: -1px;
    text-shadow: 1px 0 var(--purple);
    animation: glitch-anim2 4s infinite linear alternate-reverse;
    clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
}

@keyframes glitch-anim {
    0% { transform: translate(0); }
    95% { transform: translate(0); }
    96% { transform: translate(-1px, 1px); }
    97% { transform: translate(-1px, -1px); }
    98% { transform: translate(1px, 1px); }
    99% { transform: translate(1px, -1px); }
    100% { transform: translate(0); }
}

@keyframes glitch-anim2 {
    0% { transform: translate(0); }
    90% { transform: translate(0); }
    91% { transform: translate(1px, 1px); }
    92% { transform: translate(1px, -1px); }
    93% { transform: translate(-1px, 1px); }
    94% { transform: translate(-1px, -1px); }
    100% { transform: translate(0); }
}

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            margin-bottom: 25px;
            border: 4px solid #6027a980;
            padding: 12px;
            background-color: var(--purple);
            position: relative;
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        
        .blinking-cursor {
            animation: blink 1s infinite;
            color: var(--pink);
            font-weight: bold;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Línea de escaneo Matrix */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--pink), transparent);
            animation: scan 4s linear infinite;
            z-index: 2;
            opacity: 0.7;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        .btn {
            display: block;
            width: 90%;
            margin: 12px auto;
            padding: 12px;
            background-color: #fff0f7;
            color: var(--purple);
            border: 4px solid var(--purple);
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-family: 'Inconsolata', monospace;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 105, 180, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover {
            background-color: var(--purple);
            color: #fff0f7;
            transform: translate(5px, 5px);
            box-shadow: -8px -8px 0 var(--pink);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:active {
            transform: translate(0, 0);
            box-shadow: none;
        }
        
        .btn i {
            margin-right: 8px;
            color: var(--pink);
        }
        
        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            border-top: 2px solid var(--pink);
            padding-top: 12px;
            color: var(--purple);
            position: relative;
        }

        .footer::before {
            content: ">";
            margin-right: 5px;
            color: var(--pink);
            animation: blink 1s infinite;
        }
        
        .decoration {
            position: absolute;
            font-size: 1.2rem;
            color: var(--pink);
            opacity: 0.7;
            z-index: 1;
        }
        
        .dec-1 { top: 8px; left: 8px; }
        .dec-2 { top: 8px; right: 8px; }
        .dec-3 { bottom: 8px; left: 8px; }
        .dec-4 { bottom: 8px; right: 8px; }

        /* Efecto de parpadeo aleatorio en decoraciones */
        .decoration:nth-child(odd) {
            animation: sparkle 3s infinite;
        }

        .decoration:nth-child(even) {
            animation: sparkle 4s infinite 1s;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Media queries para responsividad */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                width: 300px;
                padding: 15px;
            }
            
            h1 {
                font-size: 1.4rem;
                padding: 10px;
                margin-bottom: 20px;
                gap: 6px;
            }
            
            .btn {
                font-size: 0.9rem;
                padding: 10px;
                margin: 10px auto;
            }
            
            .footer {
                margin-top: 20px;
                font-size: 0.75rem;
            }
            
            .decoration {
                font-size: 1rem;
            }
        }

        @media (max-width: 320px) {
            .container {
                width: 280px;
                padding: 12px;
            }
            
            h1 {
                font-size: 1.3rem;
            }
            
            .btn {
                font-size: 0.85rem;
                padding: 8px;
            }
        }

    <script>
        // Efecto Matrix de lluvia de código adaptado a los colores
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = "01✦ ☉☽☿🜂🜄🜍🜔🜕🜖🜗🜁🜤🜨♡♪♬♩♫☾☽☯☮✿❀❁✾♲♳♴♵♶♷Δ♸♹♺♻♼♽";
        const charArray = chars.split("");
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for(let i = 0; i < columns; i++) {
            drops[i] = Math.random() * canvas.height / fontSize;
        }
        
        function drawMatrix() {
            // Fondo semitransparente para efecto de rastro
            ctx.fillStyle = "rgba(96, 39, 169, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Colores alternados para los caracteres
            const colors = ['#ccffd2', '#ff69b4', '#ffffff'];
            
            ctx.font = `bold ${fontSize}px 'Inconsolata'`;
            
            for(let i = 0; i < drops.length; i++) {
                const text = charArray[Math.floor(Math.random() * charArray.length)];
                const colorIndex = Math.floor(Math.random() * colors.length);
                
                ctx.fillStyle = colors[colorIndex];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 50);
        
        // Ajustar canvas al cambiar tamaño de ventana
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
