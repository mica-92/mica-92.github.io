<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mica · dev</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'><path d='M9.4 118.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l160 160c12.5 12.5 12.5 32.8 0 45.3l-160 160c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L146.7 256 9.4 118.6zM224 384l256 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-256 0c-17.7 0-32-14.3-32-32s14.3-32 32-32z'/></svg>">
    <style>
        :root {
            --purple: #6027a9;
            --green: #ccffd2;
            --pink: #ff69b4;
            font-family: 'Inconsolata', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--purple);
            color: var(--green);
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .container {
            max-width: 580px;
            width: 92%;
            margin: 0 auto;
            border: 6px solid var(--purple);
            padding: 28px 30px 24px;
            background-color: var(--green);
            box-shadow: 12px 12px 0 #ccffd280;
            position: relative;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 3px solid var(--green);
            z-index: -1;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--pink), transparent);
            animation: scan 4s linear infinite;
            z-index: 2;
            opacity: 0.7;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .glitch {
            position: relative;
            display: inline-block;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .glitch::before {
            left: 1px;
            text-shadow: -1px 0 var(--pink);
            animation: glitch-anim 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        }

        .glitch::after {
            left: -1px;
            text-shadow: 1px 0 var(--purple);
            animation: glitch-anim2 4s infinite linear alternate-reverse;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            95% { transform: translate(0); }
            96% { transform: translate(-1px, 1px); }
            97% { transform: translate(-1px, -1px); }
            98% { transform: translate(1px, 1px); }
            99% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        @keyframes glitch-anim2 {
            0% { transform: translate(0); }
            90% { transform: translate(0); }
            91% { transform: translate(1px, 1px); }
            92% { transform: translate(1px, -1px); }
            93% { transform: translate(-1px, 1px); }
            94% { transform: translate(-1px, -1px); }
            100% { transform: translate(0); }
        }

        /* ─── HEADER ─── */
        .header {
            border-bottom: 2px solid var(--pink);
            padding-bottom: 14px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            border: 4px solid #6027a980;
            padding: 12px 16px;
            background-color: var(--purple);
            position: relative;
            color: var(--green);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 2px;
        }

        .header-sub {
            font-size: 1rem;
            color: var(--purple);
            opacity: 0.8;
            margin-top: 10px;
            letter-spacing: 0.5px;
            font-family: 'Inconsolata', monospace;
            border-top: 1px dotted var(--pink);
            padding-top: 12px;
        }

        .header-sub .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--purple);
            animation: blink 1s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
            opacity: 0.6;
        }

        .blinking-cursor {
            animation: blink 1s infinite;
            color: var(--pink);
            font-weight: bold;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ─── BOTONES ─── */
        .btn {
            display: block;
            width: 94%;
            margin: 10px auto;
            padding: 12px 16px;
            background-color: #fff0f7;
            color: var(--purple);
            border: 4px solid var(--purple);
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-family: 'Inconsolata', monospace;
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .btn .icon {
            display: inline-block;
            width: 28px;
            color: var(--pink);
            text-align: center;
            margin-right: 8px;
        }

        .btn .lock-icon {
            color: var(--pink);
            font-size: 0.7rem;
            margin-left: 6px;
        }

        .btn .arrow {
            float: right;
            color: var(--purple);
            opacity: 0.4;
            transition: transform 0.2s;
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 105, 180, 0.15), transparent);
            transition: left 0.5s;
        }

        .btn:hover {
            background-color: var(--purple);
            color: #fff0f7;
            transform: translate(5px, 5px);
            box-shadow: -8px -8px 0 var(--pink);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover .arrow {
            transform: translateX(4px);
            opacity: 1;
            color: var(--pink);
        }

        .btn:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            border-top: 2px solid var(--pink);
            padding-top: 12px;
            color: var(--purple);
            position: relative;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer::before {
            content: ">";
            margin-right: 5px;
            color: var(--pink);
            animation: blink 1s infinite;
        }

        .footer span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .decoration {
            position: absolute;
            font-size: 1.2rem;
            color: var(--pink);
            opacity: 0.7;
            z-index: 1;
        }

        .dec-1 { top: 8px; left: 8px; }
        .dec-2 { top: 8px; right: 8px; }
        .dec-3 { bottom: 8px; left: 8px; }
        .dec-4 { bottom: 8px; right: 8px; }

        .decoration:nth-child(odd) {
            animation: sparkle 3s infinite;
        }

        .decoration:nth-child(even) {
            animation: sparkle 4s infinite 1s;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ─── MODAL ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(16, 15, 15, 0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--green);
            border: 6px solid var(--purple);
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 12px 12px 0 var(--purple);
            text-align: left;
        }

        .modal .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--purple);
            cursor: pointer;
            font-family: 'Inconsolata', monospace;
            transition: transform 0.2s;
        }

        .modal .close-btn:hover {
            transform: rotate(90deg);
        }

        .modal .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--purple);
            margin-bottom: 6px;
            font-family: 'Inconsolata', monospace;
        }

        .modal .modal-sub {
            font-size: 0.85rem;
            color: var(--purple);
            opacity: 0.7;
            margin-bottom: 16px;
            font-family: 'Inconsolata', monospace;
        }

        .modal .modal-desc {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--purple);
            font-family: 'Inconsolata', monospace;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(96, 39, 169, 0.06);
            border-left: 3px solid var(--pink);
        }

        .modal .modal-link {
            display: inline-block;
            padding: 10px 24px;
            background-color: var(--purple);
            color: var(--green);
            border: 3px solid var(--purple);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: all 0.2s;
            font-family: 'Inconsolata', monospace;
        }

        .modal .modal-link:hover {
            background-color: var(--green);
            color: var(--purple);
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 var(--purple);
        }

        .modal .modal-pass {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .modal .modal-pass input {
            flex: 1;
            padding: 10px 14px;
            border: 3px solid var(--purple);
            background: white;
            font-family: 'Inconsolata', monospace;
            font-size: 0.95rem;
            color: var(--purple);
            outline: none;
            min-width: 160px;
        }

        .modal .modal-pass input:focus {
            border-color: var(--pink);
        }

        .modal .modal-pass .pass-btn {
            padding: 10px 20px;
            background: var(--purple);
            color: var(--green);
            border: 3px solid var(--purple);
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inconsolata', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .modal .modal-pass .pass-btn:hover {
            background: var(--green);
            color: var(--purple);
        }

        .modal .modal-pass .pass-error {
            color: #d14d41;
            font-size: 0.85rem;
            font-weight: 700;
            width: 100%;
            display: none;
        }

        .modal .modal-pass .pass-error.show {
            display: block;
        }

        .modal .modal-tag {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 0;
            background: var(--pink);
            color: var(--purple);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 16px; }
            h1 { font-size: 1.4rem; padding: 10px; }
            .header-sub { font-size: 0.9rem; }
            .btn { font-size: 0.85rem; padding: 10px; }
            .footer { font-size: 0.7rem; gap: 10px; }
            .decoration { font-size: 1rem; }
            .modal { padding: 20px; margin: 10px; }
            .modal .modal-title { font-size: 1.3rem; }
            .modal .modal-pass input { min-width: 120px; font-size: 0.85rem; }
        }

        @media (max-width: 320px) {
            .container { padding: 12px; }
            h1 { font-size: 1.2rem; }
            .btn { font-size: 0.8rem; padding: 8px; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    
    <div class="container">
        <div class="scan-line"></div>
        <div class="decoration dec-1">✦</div>
        <div class="decoration dec-2">✦</div>
        <div class="decoration dec-3">✦</div>
        <div class="decoration dec-4">✦</div>
        
        <!-- HEADER con descripción -->
        <div class="header">
            <h1>
                <i class="fa-solid fa-terminal"></i> 
                <span class="glitch" data-text="mica·dev">mica·dev</span>
                <span class="blinking-cursor">|</span>
            </h1>
            <div class="header-sub">
                archivo de códigos personales, herramientas y experimentos
                <span class="cursor-blink"></span>
            </div>
        </div>
        
        <div id="buttons-container"></div>
        
        <div class="footer">
            <span><i class="fa-regular fa-star" style="color:var(--pink);"></i> emergente</span>
            <span><i class="fa-regular fa-star" style="color:var(--pink);"></i> autodidacta</span>
            <span><i class="fa-regular fa-star" style="color:var(--pink);"></i> 2025</span>
        </div>
    </div>

    <!-- ─── MODAL ─── -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modalTitle">Proyecto</div>
            <div class="modal-sub" id="modalSub"></div>
            <div class="modal-desc" id="modalDesc"></div>
            <div id="modalActions"></div>
            <div id="modalLock" style="display:none;" class="modal-pass">
                <input type="password" id="passInput" placeholder="clave..." onkeydown="if(event.key==='Enter') verifyPass()">
                <button class="pass-btn" onclick="verifyPass()">entrar</button>
                <span class="pass-error" id="passError">✕ clave incorrecta</span>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // DATOS — Edita este JSON para agregar/quitar proyectos
        // ═══════════════════════════════════════════════════════════

        const PROJECTS = [
            {
                "id": "navanga",
                "name": "Navāṅga",
                "description": "Exploración de la geometría sagrada y los patrones numéricos en el arte y la arquitectura. Una herramienta interactiva para visualizar formas y proporciones.",
                "link": "https://mica-92.github.io/navanga/",
                "pass": null
            },
            {
                "id": "cv",
                "name": "Curriculum Vitae",
                "description": "Mi trayectoria profesional y académica. Un CV interactivo con diseño inspirado en terminales y sistemas antiguos.",
                "link": "https://mica-92.github.io/mninni/",
                "pass": null
            },
            {
                "id": "summation",
                "name": "In Summation",
                "description": "Recopilación de escritos, reflexiones y apuntes sobre tecnología, filosofía y cultura digital. Un archivo personal.",
                "link": "https://mica-92.github.io/in-summation/",
                "pass": null
            },
            {
                "id": "usna",
                "name": "Usna",
                "description": "Proyecto en desarrollo. Un sistema de gestión de conocimiento para equipos distribuidos.",
                "link": "https://mica-92.github.io/anthology_notes/",
                "pass": null
            },
            {
                "id": "usna-yms",
                "name": "Usna YMS",
                "description": "Extensión de Usna enfocada en la gestión de flujos de trabajo y seguimiento de tareas.",
                "link": "https://mica-92.github.io/anthology_notes/",
                "pass": null
            },
            {
                "id": "jobtracker",
                "name": "JOBTracker",
                "description": "Sistema de control horario para equipos móviles en retail. Herramienta local que complementa sistemas corporativos, permitiendo detectar anomalías, calcular tiempos de traslado y visualizar la jornada completa de repositores en múltiples ubicaciones.",
                "link": "https://mica-92.github.io/JOBTracker/",
                "pass": "jobtracker2024"
            }
        ];

        // ═══════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════

        function renderButtons() {
            const container = document.getElementById('buttons-container');
            container.innerHTML = '';
            
            PROJECTS.forEach(p => {
                const btn = document.createElement('a');
                btn.className = 'btn';
                btn.href = '#';
                btn.setAttribute('data-id', p.id);
                
                const hasPass = p.pass && p.pass.length > 0;
                const lockIcon = hasPass ? ' <i class="fas fa-lock lock-icon"></i>' : '';
                
                btn.innerHTML = `
                    <span class="icon">✦</span>
                    ${p.name}${lockIcon}
                    <span class="arrow">→</span>
                `;
                
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    openModal(p.id);
                });
                
                container.appendChild(btn);
            });
        }

        // ═══════════════════════════════════════════════════════════
        // MODAL
        // ═══════════════════════════════════════════════════════════

        let currentProject = null;
        let isUnlocked = false;

        function openModal(id) {
            const project = PROJECTS.find(p => p.id === id);
            if (!project) return;
            
            currentProject = project;
            isUnlocked = false;
            
            document.getElementById('modalTitle').textContent = project.name;
            document.getElementById('modalSub').textContent = project.id;
            document.getElementById('modalDesc').textContent = project.description;
            
            const actionsDiv = document.getElementById('modalActions');
            const lockDiv = document.getElementById('modalLock');
            const passInput = document.getElementById('passInput');
            const passError = document.getElementById('passError');
            
            passError.classList.remove('show');
            passInput.value = '';
            
            const hasPass = project.pass && project.pass.length > 0;
            
            if (hasPass) {
                lockDiv.style.display = 'flex';
                actionsDiv.innerHTML = `
                    <span class="modal-tag"><i class="fas fa-lock"></i> protegido</span>
                    <p style="margin-top:8px;font-size:0.85rem;color:var(--purple);opacity:0.7;font-family:'Inconsolata',monospace;">
                        ingresa la clave para acceder
                    </p>
                `;
            } else {
                lockDiv.style.display = 'none';
                actionsDiv.innerHTML = `
                    <a href="${project.link}" target="_blank" class="modal-link">
                        <i class="fas fa-arrow-right"></i> visitar
                    </a>
                `;
            }
            
            document.getElementById('modalOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
            
            if (hasPass) {
                setTimeout(() => passInput.focus(), 300);
            }
        }

        function verifyPass() {
            if (!currentProject) return;
            
            const input = document.getElementById('passInput');
            const error = document.getElementById('passError');
            
            if (input.value === currentProject.pass) {
                isUnlocked = true;
                error.classList.remove('show');
                
                const actionsDiv = document.getElementById('modalActions');
                actionsDiv.innerHTML = `
                    <a href="${currentProject.link}" target="_blank" class="modal-link">
                        <i class="fas fa-arrow-right"></i> visitar
                    </a>
                    <span class="modal-tag" style="background:var(--green);color:var(--purple);border:1px solid var(--purple);">
                        <i class="fas fa-check"></i> desbloqueado
                    </span>
                `;
                
                document.getElementById('modalLock').style.display = 'none';
                
            } else {
                error.classList.add('show');
                input.value = '';
                input.focus();
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            document.body.style.overflow = '';
            currentProject = null;
            isUnlocked = false;
        }

        // Cerrar con ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // Cerrar haciendo clic en el overlay
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ═══════════════════════════════════════════════════════════
        // MATRIX BACKGROUND
        // ═══════════════════════════════════════════════════════════

        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = "01✦ ☉☽☿🜂🜄🜍🜔🜕🜖🜗🜁🜤🜨♡♪♬♩♫☾☽☯☮✿❀❁✾♲♳♴♵♶♷Δ♸♹♺♻♼♽";
        const charArray = chars.split("");
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for(let i = 0; i < columns; i++) {
            drops[i] = Math.random() * canvas.height / fontSize;
        }
        
        function drawMatrix() {
            ctx.fillStyle = "rgba(96, 39, 169, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const colors = ['#ccffd2', '#ff69b4', '#ffffff'];
            ctx.font = `bold ${fontSize}px 'Inconsolata'`;
            
            for(let i = 0; i < drops.length; i++) {
                const text = charArray[Math.floor(Math.random() * charArray.length)];
                const colorIndex = Math.floor(Math.random() * colors.length);
                
                ctx.fillStyle = colors[colorIndex];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 50);
        
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ═══════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', renderButtons);
    </script>
</body>
</html>
